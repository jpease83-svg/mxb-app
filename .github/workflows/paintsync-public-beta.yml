name: Paint Sync Public Beta

on:
  push:
    branches:
      - release/paintsync-public-beta-0.12.0
    paths:
      - ".github/workflows/paintsync-public-beta.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paintsync-public-beta-0.12.0
  cancel-in-progress: false

env:
  BETA_VERSION: 0.12.0-beta.1
  BETA_TAG: paintsync-v0.12.0-beta.1
  CONTROL_PLANE: https://amx-paint-sync.jpease83-amx.workers.dev

jobs:
  verify-build-release:
    name: Verify, build and publish Windows beta
    runs-on: windows-latest

    steps:
      - name: Checkout exact public-beta source
        uses: actions/checkout@v4
        with:
          ref: release/paintsync-public-beta-0.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./server-agent -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend lint
        run: npm run lint

      - name: Frontend public-beta build
        env:
          VITE_PAINTSYNC_PUBLIC_BETA: "1"
        run: npm run build

      - name: Rust desktop tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Server-agent tests
        working-directory: server-agent
        run: cargo test --locked

      - name: Install control-plane dependencies
        working-directory: control-plane
        run: npm ci

      - name: Generate control-plane types
        working-directory: control-plane
        run: npx wrangler types

      - name: Control-plane typecheck
        working-directory: control-plane
        run: npx tsc --noEmit

      - name: Control-plane tests
        working-directory: control-plane
        run: npx vitest run

      - name: Verify live public-beta service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = $env:CONTROL_PLANE.TrimEnd('/')

          Write-Host 'Checking control-plane health...'
          $health = Invoke-WebRequest -Uri "$base/health" -Method Get -SkipHttpErrorCheck
          if ($health.StatusCode -ne 200) {
            throw "Control-plane /health returned HTTP $($health.StatusCode)."
          }
          $healthJson = $health.Content | ConvertFrom-Json
          if (-not $healthJson.ok) {
            throw 'Control-plane /health did not report ok=true.'
          }

          Write-Host 'Checking public server-registry route...'
          $servers = Invoke-WebRequest -Uri "$base/v1/servers" -Method Get -SkipHttpErrorCheck
          if ($servers.StatusCode -ne 200) {
            throw "Public /v1/servers returned HTTP $($servers.StatusCode)."
          }
          # Parsing catches HTML/proxy/error bodies that happen to return 200.
          $null = $servers.Content | ConvertFrom-Json

          Write-Host 'Checking that public paint enrollment is really open...'
          $body = @{ code = ''; riderName = 'PaintSyncBetaPreflight' } | ConvertTo-Json -Compress
          $enroll = Invoke-WebRequest `
            -Uri "$base/v1/enroll" `
            -Method Post `
            -ContentType 'application/json' `
            -Body $body `
            -SkipHttpErrorCheck

          if ($enroll.StatusCode -eq 201) {
            $created = $enroll.Content | ConvertFrom-Json
            if (-not $created.token) {
              throw 'Enrollment returned 201 but no bearer token.'
            }
            # Validate the token without ever printing it to the Actions log.
            $me = Invoke-WebRequest `
              -Uri "$base/v1/me" `
              -Method Get `
              -Headers @{ Authorization = "Bearer $($created.token)" } `
              -SkipHttpErrorCheck
            if ($me.StatusCode -ne 200) {
              throw "New public-beta token could not read /v1/me (HTTP $($me.StatusCode))."
            }
            Write-Host 'Public enrollment created and authenticated the reserved preflight account.'
          } elseif ($enroll.StatusCode -eq 409) {
            # Expected after the first green release run. In private mode an empty invite
            # code is rejected before duplicate-name lookup, so 409 still proves the public
            # enrollment path is active.
            Write-Host 'Reserved preflight account already exists; public enrollment path is active.'
          } else {
            $detail = $enroll.Content
            throw "Public enrollment preflight failed with HTTP $($enroll.StatusCode): $detail"
          }

      - name: Route FrostMod to Paint Sync release channel
        shell: pwsh
        run: |
          $path = 'src-tauri/src/frostmod_manage.rs'
          $text = Get-Content $path -Raw
          $from = 'const REPO: &str = "Frostn1/frostmod";'
          $to = 'const REPO: &str = "jpease83-svg/frostmod";'
          $count = ([regex]::Matches($text, [regex]::Escape($from))).Count
          if ($count -ne 1) {
            throw "Expected exactly one FrostMod upstream channel constant; found $count."
          }
          Set-Content -Path $path -Value $text.Replace($from, $to) -NoNewline -Encoding utf8

      - name: Verify public-beta Tauri isolation
        shell: pwsh
        run: |
          $cfg = Get-Content '.github/public-beta-tauri.conf.json' -Raw | ConvertFrom-Json
          if ($cfg.productName -ne 'MXB App Paint Sync Beta') { throw 'Unexpected beta product name.' }
          if ($cfg.version -ne $env:BETA_VERSION) { throw 'Beta config version does not match workflow version.' }
          if ($cfg.identifier -eq 'com.frost.mxbikes') { throw 'Public beta must not share Frost app identity.' }
          if ($cfg.identifier -ne 'com.peasey.mxbikes.paintsync-test') { throw 'Unexpected Paint Sync app identifier.' }
          if ($cfg.bundle.createUpdaterArtifacts -ne $false) { throw 'Unsigned beta must not create updater artifacts.' }
          $endpoint = $cfg.plugins.updater.endpoints[0]
          if ($endpoint -notlike '*jpease83-svg/mxb-app*') { throw 'Beta updater endpoint still targets another repository.' }
          $scheme = $cfg.plugins.'deep-link'.desktop.schemes[0]
          if ($scheme -eq 'mxb') { throw 'Beta must not claim Frost normal deep-link scheme.' }

          $updates = Get-Content 'src/Context/Update.tsx' -Raw
          if (-not $updates.Contains('VITE_PAINTSYNC_PUBLIC_BETA')) {
            throw 'Public-beta manual update gate is missing.'
          }

      - name: Build isolated unsigned Windows public beta
        env:
          VITE_PAINTSYNC_PUBLIC_BETA: "1"
          MXB_RELEASE_TAG: v0.12.0-beta.1
        run: npm run tauri -- build --ci --bundles nsis --no-sign --config .github/public-beta-tauri.conf.json

      - name: Stage public download files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path public-beta | Out-Null
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced.' }

          $publicName = "MXB-App-Paint-Sync-Beta-$($env:BETA_VERSION)-Windows-x64.exe"
          Copy-Item $installer.FullName "public-beta/$publicName"

          @'
          MXB APP PAINT SYNC PUBLIC BETA

          This is an experimental community Paint Sync build, not an official Frost release.

          FIRST-TIME SETUP
          1. Close MX Bikes before installing or updating FrostMod.
          2. Install the Windows beta EXE.
          3. Open MXB App Paint Sync Beta.
          4. Confirm the MX Bikes install/mods/profile folders are correct.
          5. Open Settings > FrostMod and install/update FrostMod. This beta uses the dedicated Paint Sync FrostMod channel.
          6. Open Settings > Experimental and enable Servers and paint sync.
          7. Open Servers, select the exact MX Bikes profile you race with, and choose Join public beta.
          8. Click Publish now once.
          9. Launch MX Bikes through the app and join a server.

          WHAT TO TEST
          - Bike livery
          - Helmet paint
          - Goggle paint
          - Rider/suit paint
          - Gloves
          - Boots
          - Protection
          - Late joiners and reconnects
          - A paint owner publishing once, closing the app, and another viewer retrieving the published look

          IMPORTANT LIMITATIONS
          - Every viewer who wants to see synced paints needs the Paint Sync beta client.
          - A rider who has never published their look has nothing for another viewer to retrieve.
          - Paint Sync distributes .pnt files only. Matching custom bike/helmet/rider/boot/etc. 3D models must already be installed on the viewer's PC.
          - This first public beta is unsigned. Windows SmartScreen may warn about an unknown publisher.
          - In-app app updates are intentionally manual in this beta until this fork has its own Tauri signing key. FrostMod updates are managed separately inside the app.

          REPORTING A FAILURE
          Please include:
          - Paint Sync beta version
          - Your rider name and the other rider's name
          - Server name
          - Bike ID/model
          - Helmet/rider/goggle model names when relevant
          - Which paint slots worked and which did not
          - Whether both PCs had the same underlying custom model installed
          - Whether the owner had clicked Publish now at least once
          - A shared/exported log bundle from Settings > Logs when possible

          Bugs: https://github.com/jpease83-svg/mxb-app/issues
          '@ | Set-Content 'public-beta/PUBLIC-BETA-README.txt' -Encoding utf8

          $hash = (Get-FileHash "public-beta/$publicName" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $publicName" | Set-Content 'public-beta/SHA256SUMS.txt' -Encoding ascii
          Write-Host "Installer: $publicName"
          Write-Host "SHA256: $hash"

      - name: Upload immutable Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: mxb-app-paintsync-public-beta-0.12.0-beta.1
          path: public-beta/*
          if-no-files-found: error

      - name: Compose public beta release notes
        shell: pwsh
        run: |
          @'
          ## MXB App Paint Sync Public Beta 0.12.0-beta.1

          This is an **experimental community beta** for gathering real-world Paint Sync results. It is not an official Frost release and it installs under a separate Paint Sync application identity.

          ### What this beta is testing
          - Bike liveries
          - Helmet paints
          - Goggle paints
          - Rider/suit, gloves, boots and protection paints
          - Late joiners and reconnects
          - Recent-rider catalog retrieval when the paint owner is no longer running the app
          - Community MX Bikes servers without a dedicated server agent

          ### Important before testing
          Every viewer who wants to see synchronized paints needs this beta client. Paint owners only need to publish their look at least once. Custom 3D models are **not** redistributed; both PCs must already have the same underlying custom model for a paint made for that model to render.

          ### First-time setup
          1. Close MX Bikes.
          2. Run the Windows installer attached below.
          3. Open **Settings → FrostMod** and install/update FrostMod.
          4. Open **Settings → Experimental** and enable **Servers and paint sync**.
          5. Open **Servers**, select the exact MX Bikes profile you ride with, and choose **Join public beta**.
          6. Click **Publish now** once.
          7. Launch MX Bikes through the app and join a server.

          ### Helmet and goggles
          This candidate includes the pre-session paint prefetch and the corrected goggle path resolution. The build, frontend checks and Rust test suite passed before publication. Real multiplayer testing is still the point of this beta, so please report any helmet/goggle combination that still renders stock/default.

          ### Updates and Windows warning
          This first public beta is **unsigned**, so Windows SmartScreen may show an unknown-publisher warning. App self-updates are intentionally manual until this fork has its own Tauri updater signing key. The app will not fall back to Frost's normal updater channel. FrostMod itself still updates through the dedicated Paint Sync FrostMod channel.

          ### Report useful failures
          Include rider names, server name, bike/model IDs, helmet/rider/goggle model names, which slots worked/failed, whether both PCs had the same custom model, whether the owner published once, and an exported/shared log bundle when possible.

          Bug reports: https://github.com/jpease83-svg/mxb-app/issues

          The attached `PUBLIC-BETA-README.txt` contains the same setup/test checklist. `SHA256SUMS.txt` lets testers verify the installer bytes.
          '@ | Set-Content public-beta/RELEASE-NOTES.md -Encoding utf8

      - name: Publish or refresh GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:BETA_TAG
          $files = @(
            (Get-ChildItem 'public-beta/MXB-App-Paint-Sync-Beta-*.exe').FullName,
            (Resolve-Path 'public-beta/PUBLIC-BETA-README.txt').Path,
            (Resolve-Path 'public-beta/SHA256SUMS.txt').Path
          )

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag `
              --repo $env:GITHUB_REPOSITORY `
              --title "MXB App Paint Sync Public Beta $($env:BETA_VERSION)" `
              --notes-file public-beta/RELEASE-NOTES.md `
              --prerelease
            foreach ($file in $files) {
              gh release upload $tag $file --repo $env:GITHUB_REPOSITORY --clobber
            }
          } else {
            gh release create $tag @files `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "MXB App Paint Sync Public Beta $($env:BETA_VERSION)" `
              --notes-file public-beta/RELEASE-NOTES.md `
              --prerelease
          }

          gh release view $tag --repo $env:GITHUB_REPOSITORY --json url,tagName,isPrerelease,name
