name: CI

# Verification on every push to main and every PR. Release builds (release.yml) only
# run on a tag, so without this nothing checks a change before it lands.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  rust:
    name: Rust (test) — ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is the quick check; Windows is what ships, so it must pass there too.
        platform: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `cargo fmt --check` gate: the tree has never been rustfmt'd (~170 sites across
      # nearly every file), so a format pass wants its own commit — and one right now
      # would conflict across the unmerged feature/garage-bike-switch work.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # The crate links against Tauri's webview stack, so a Linux build needs the
      # system libs even when we're only running tests. `libasound2-dev` is for voice
      # chat: cpal pulls in alsa-sys, whose build script shells out to pkg-config and
      # fails the whole job without it.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libasound2-dev \
            patchelf

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Run tests
        working-directory: ./src-tauri
        # Tests needing a real MX Bikes asset are `#[ignore]`d and stay skipped here.
        run: cargo test --locked

  # The two things paint sync depends on that nothing was checking. Both ship separately
  # from the app — the Worker is deployed by hand and the agent runs on someone else's
  # machine — so a break in either surfaced only when a player hit it.
  control-plane:
    name: Control plane (typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./control-plane
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Wrangler 4 refuses to run on anything older, and `wrangler types` is what
          # generates the `Env` the typecheck needs.
          node-version: 22
          cache: npm
          cache-dependency-path: control-plane/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `Env` comes from a generated `worker-configuration.d.ts` that is gitignored, so it
      # has to be regenerated before anything can typecheck.
      - name: Generate Worker types
        run: npx wrangler types

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

  bootstrap-script:
    # The one part of this repo that runs somewhere nobody can watch.
    #
    # Both scripts execute only as EC2 user-data on a Windows box with no console and no key
    # pair, where every failure path ends in `Stop-Computer` and takes the transcript with it.
    # They are also assembled by string interpolation -- a dozen escaped backticks and thirty
    # escaped backslashes -- so a mis-escaped one produces PowerShell that is malformed rather
    # than merely wrong, and `tsc` sees only a string either way. That is what this catches.
    #
    # It would not have caught the failures that actually lost builds so far: `-Tail -Raw` was
    # an invalid parameter set, the hand-built `agent.json` was valid PowerShell holding invalid
    # JSON, and `Start-BitsTransfer` failed at runtime. A parser sees none of those.
    name: Bootstrap script (parse)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-plane/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./control-plane

      - name: Render the bootstrap scripts
        run: npm run render:bootstrap -- "${{ runner.temp }}"
        working-directory: ./control-plane

      - name: Parse them with PowerShell
        shell: pwsh
        run: |
          $bad = $false
          foreach ($name in @("bootstrap.ps1", "image-bootstrap.ps1")) {
            $path = Join-Path "${{ runner.temp }}" $name
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref] $null, [ref] $errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $bad = $true
              Write-Host "::error file=control-plane/src/bootstrap.ts::$name does not parse"
              foreach ($e in $errors) { Write-Host "  line $($e.Extent.StartLineNumber): $($e.Message)" }
            } else {
              Write-Host "$name parses"
            }
          }
          if ($bad) { exit 1 }

  server-agent:
    name: Server agent (test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./server-agent -> target

      - name: Run tests
        working-directory: ./server-agent
        run: cargo test --locked
