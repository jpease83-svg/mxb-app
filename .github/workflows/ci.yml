name: CI

# Verification on every push to main and every PR. Release builds (release.yml) only
# run on a tag, so without this nothing checks a change before it lands.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  rust:
    name: Rust (test) — ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is the quick check; Windows is what ships, so it must pass there too.
        platform: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `cargo fmt --check` gate: the tree has never been rustfmt'd (~170 sites across
      # nearly every file), so a format pass wants its own commit — and one right now
      # would conflict across the unmerged feature/garage-bike-switch work.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # The crate links against Tauri's webview stack, so a Linux build needs the
      # system libs even when we're only running tests. `libasound2-dev` is for voice
      # chat: cpal pulls in alsa-sys, whose build script shells out to pkg-config and
      # fails the whole job without it.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libasound2-dev \
            patchelf

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Run tests
        working-directory: ./src-tauri
        # Tests needing a real MX Bikes asset are `#[ignore]`d and stay skipped here.
        run: cargo test --locked

  # The two things paint sync depends on that nothing was checking. Both ship separately
  # from the app — the Worker is deployed by hand and the agent runs on someone else's
  # machine — so a break in either surfaced only when a player hit it.
  control-plane:
    name: Control plane (typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./control-plane
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Wrangler 4 refuses to run on anything older, and `wrangler types` is what
          # generates the `Env` the typecheck needs.
          node-version: 22
          cache: npm
          cache-dependency-path: control-plane/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `Env` comes from a generated `worker-configuration.d.ts` that is gitignored, so it
      # has to be regenerated before anything can typecheck.
      - name: Generate Worker types
        run: npx wrangler types

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

  # A fork cannot use the canonical repository's updater-signing key. Manual CI runs
  # therefore also produce a Windows-only, unsigned test installer with updater artifacts
  # disabled. It installs under a separate app identity so testing cannot replace a normal
  # MXB App installation.
  windows-test-installer:
    name: Windows paint-sync test installer
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build isolated unsigned installer
        run: npm run tauri -- build --ci --bundles nsis --no-sign --config .github/test-tauri.conf.json

      - name: Upload Windows test build
        uses: actions/upload-artifact@v4
        with:
          name: mxb-app-paintsync-windows-test
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/MXB App.exe
          if-no-files-found: error

  server-agent:
    name: Server agent (test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./server-agent -> target

      - name: Run tests
        working-directory: ./server-agent
        run: cargo test --locked
