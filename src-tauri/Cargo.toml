[package]
# `mainBinaryName` renames the bundled binary, but only for `tauri build` — a dev run is
# whatever cargo called it. Cargo target names can't hold a space, so this is as close as
# it gets. The description is what Windows Task Manager shows in its Processes tab.
name = "mxb-app"
version = "0.11.1"
description = "MXB App — MX Bikes mod manager"
authors = ["Frost"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
# One app, one process. Closing the window parks MXB App in the tray, so without this
# every launch after the first stacks up another copy — another tray icon, another
# FrostMod, another mod watcher.
tauri-plugin-single-instance = "2"
# Self-update: check GitHub Releases, download + install, then relaunch.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Launch on login (Discord-style always-on companion).
tauri-plugin-autostart = "2"
# System-wide hotkey for the in-game overlay: the game has keyboard focus when the
# player presses it, so a webview-level listener would never see it.
tauri-plugin-global-shortcut = "2"
# File logging to the app log dir (Windows: %LOCALAPPDATA%\com.frost.mxbikes\logs).
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs-next = "2.0.0"
walkdir = "2"
# `imgcache` encodes an image's source URL into the path of its custom-scheme URL, so the
# handler has to decode it. Already in the tree via reqwest/url; named here because we use it.
percent-encoding = "2"
# The custom URI scheme handler builds its own responses. Same crate Tauri re-exports.
http = "1"
# How much memory this process is holding, for `memwatch`. A few lines of platform FFI
# behind one call; not worth hand-rolling three times over.
memory-stats = "1"
# rustls: consistent modern TLS across platforms (native SChannel failed on
# Windows). MediaFire downloads work directly with this client — its CDN no
# longer blocks the rustls fingerprint (verified against a live 427 MB .pkz).
# `gzip`/`brotli` are not just bandwidth: without them reqwest sends no
# `Accept-Encoding` at all, which makes a client claiming to be Chrome look
# nothing like Chrome to a bot filter.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
    "cookies",
    "gzip",
    "brotli",
    # Preset bundles upload as a multipart form.
    "multipart",
] }
# `sync` for the mutex that stops two simultaneous 403s opening two clearance windows.
tokio = { version = "1", features = ["time", "sync", "rt"] }
futures-util = { version = "0.3", features = ["io"] }
# Pure-Rust MEGA API client (built on reqwest): downloads + decrypts public
# shared links in-app, so end users don't need the megatools/MEGAcmd binary.
mega = "0.8"
scraper = "0.20"
regex = "1"
html-escape = "0.2"
zip = "2"
sevenz-rust = "0.6"
unrar = "0.5"
# DEFLATE codec for compressed in-app payloads.
flate2 = "1"
# Decode + downscale in-archive track/bike preview images (TGA/PNG/JPEG/BMP) into small
# PNG thumbnails for the library cards, and downscale remote catalog thumbnails in
# `imgcache` — mxbikes-shop.com serves 1000-1280px originals for cards rendered at a
# quarter that size. `webp`/`gif` exist for those remote images: a good share of the
# store's product images are WebP.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "tga",
    "bmp",
    "webp",
    "gif",
] }
# Encode PNG thumbnails as `data:` URIs (no asset-protocol wiring needed).
base64 = "0.22"
# Parallelize the (CPU-bound) per-texture PNG encode when loading a bike/rider
# model — a bike with several paints would otherwise encode them one at a time.
rayon = "1"
anyhow = "1"
# Move uninstalled mods to the OS Recycle Bin / Trash rather than deleting outright.
trash = "5"
# Watch the mods content folder so tracks/bikes dropped in outside the app still
# trigger a FrostMod reload. Debounced so an extract burst yields one reload.
notify = "6"
notify-debouncer-mini = "0.4"
# Check an installed FrostMod binary against the digest its GitHub release advertises,
# so an install that only half-applied can be spotted and repaired.
sha2 = "0.10"
# The 16-byte digest a `.pnt`/`.edf` texture header carries beside its dimensions, written
# when the app builds a paint of its own (`paint::encode`). Shares the `digest` traits
# `sha2` already pulls in, so it costs one small crate.
md-5 = "0.10"
# Compile-time string obfuscation: sensitive endpoints/hosts are XOR-encoded in the
# binary and decoded on the stack at use, so they don't show up in a `strings` dump.
obfstr = "0.4"
tauri-plugin-deep-link = "2.4.9"
# Microphone capture and playback for voice chat (WASAPI on Windows, CoreAudio on macOS).
#
# Held at 0.15 deliberately: 0.18 does not build for Windows in this workspace. Its WASAPI
# backend implements COM interfaces against a newer `windows-core` than the one Cargo
# unifies on here (Tauri pulls the `windows` crates in too), so `IMMNotificationClient`
# and friends fail their `Interface`/`RuntimeName` bounds — 18 errors, none of them ours.
# 0.15 vendors its own `windows 0.54` and sidesteps the conflict entirely. Check
# `cargo check --target x86_64-pc-windows-gnu` before raising this; a macOS build won't
# catch it, and a Windows-first app can't ship without it.
cpal = "0.15"

# The rest of voice: the codec, the peer-to-peer transport, and the socket that introduces
# two apps to each other.
#
# `str0m` is sans-IO WebRTC — we own the UDP socket and the loop, it owns ICE, DTLS and the
# data channel. `rust-crypto` rather than the default backend so there is no OpenSSL or
# aws-lc to build: the whole stack cross-compiles to Windows with nothing installed.
str0m = { version = "0.23", default-features = false, features = ["rust-crypto"] }
# libopus, vendored and built from source by `opusic-sys` — no system library to find.
opus = "0.4"
# Signalling is one long-lived WebSocket carrying a few KB per join, so it is the blocking
# client on its own thread rather than an async one: the voice subsystem is threads and
# channels throughout (see `Monitor`), and a second runtime would buy nothing.
tungstenite = { version = "0.24", default-features = false, features = [
    "handshake",
    "rustls-tls-webpki-roots",
] }

# Only for putting a mod back after an uninstall. `trash` calls `trashItemAtURL` but throws
# away the destination it reports, and the Trash folder can't simply be read back — macOS
# refuses `~/.Trash` to an app without Full Disk Access. Asking the API where it put the file
# is the one way to know. Both are already in the tree as `trash`'s own dependencies.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSFileManager", "NSURL", "NSError", "NSString"] }

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# Tauri's mock runtime, so the overlay's window lifecycle (create → show → hide) can be
# exercised without a display or a real webview. Dev-only — dev-dependencies aren't part
# of a normal build, so the shipped binary never gets the `test` feature.
tauri = { version = "2", features = ["test"] }
# `#[tokio::test]` for the live network checks against mxb-mods.com. Dev-only, so the
# shipped binary keeps the minimal `time`-only tokio it already had.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }

# `tauri dev` builds this profile, and cargo's default leaves everything at opt-level 0 —
# which is fine for our own glue but not for the crates doing the heavy lifting. Unpacking one
# 36 MB gear paint (three 4096² textures) spends nearly all its time inside `flate2`'s inflate
# and `image`'s resize: 4.3 s unoptimized against 0.33 s optimized.
[profile.dev]
# The local crate too, but only lightly: a creator-sealed `.pnt` is decrypted a byte at a time
# over the whole file before it is even parsed, and that loop is ours. Keeps debug info.
opt-level = 1

[profile.dev.package."*"]
# Dependencies are never stepped through, and they're built once and then cached.
opt-level = 3

# Ship a hardened, hard-to-reverse binary. cargo defaults leave the symbol table in and
# emit no debug info; this strips symbols and leans on the optimizer to erase structure.
# opt-level stays at 3 so the viewer's hot paths aren't sacrificed for it.
[profile.release]
opt-level = 3
# Remove the symbol table (and any debug symbols) from every platform's artifact, so a
# profiler/decompiler sees `frost.exe+0x…` rather than function names.
strip = "symbols"
# Fat cross-crate LTO: inlines and merges functions across crate boundaries, which both
# speeds up hot paths and dissolves the clean call structure a decompiler leans on.
lto = "fat"
# One codegen unit: maximal optimization, and fewer tidy module boundaries to recover.
codegen-units = 1
# Abort on panic: drops the unwinding tables and landing pads (smaller, less to read).
# Safe here — nothing in the crate relies on catching a panic (no catch_unwind).
panic = "abort"
# No debug info: on Windows/MSVC this means no PDB is produced at all.
debug = false
# Strip the overflow-check branches from release too.
overflow-checks = false
